<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Guarapuava | Edição Verde & Azul (Nuvens)</title>
  <style>
    /* ==========================================================
       1. VARIÁVEIS DE CORES E ESTILOS GLOBAIS (INALTERADOS)
       ========================================================== */
    :root {
      /* Gradiente de fundo: Verde Esmeralda -> Azul Oceano Profundo */
      --bg-gradient: linear-gradient(135deg, #064e3b 0%, #0d9488 45%, #1e3a8a 100%);
      --card-bg: rgba(15, 23, 42, 0.45);
      --card-border: rgba(45, 212, 191, 0.3); /* Borda em ciano/verde */
      --accent-green: #34d399; /* Verde neon para destaques */
      --accent-blue: #38bdf8;  /* Azul claro para métricas secundárias */
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================================
       2. CARTÃO PRINCIPAL E EFEITOS VISUAIS (INALTERADOS)
       ========================================================== */
    .weather-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(52, 211, 153, 0.15); /* Brilho esverdeado */
      position: relative;
      overflow: hidden;
    }

    /* Brilho decorativo no topo (Inalterado) */
    .weather-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: -60px;
      width: 180px;
      height: 180px;
      background: rgba(52, 211, 153, 0.3);
      filter: blur(70px);
      border-radius: 50%;
      z-index: 0;
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    /* ==========================================================
       3. CABEÇALHO & DECORAÇÃO DE NUVENS EM CÓDIGO (NOVO)
       ========================================================== */
    header {
      text-align: center;
      margin-bottom: 5px; /* Reduzido para acomodar nuvens */
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #6ee7b7, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Banner decorativo com nuvens em CSS puro (Substitui a imagem) */
    .weather-decoration-box {
      width: 100%;
      height: 100px; /* Reduzido em comparação à imagem anterior */
      border-radius: 20px;
      margin: 15px 0;
      position: relative;
      background: rgba(255, 255, 255, 0.03); /* Fundo sutil */
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    /* Estilização das nuvens em CSS */
    .cloud {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      position: absolute;
    }

    .cloud::after, .cloud::before {
      content: '';
      background: inherit;
      border-radius: 50%;
      position: absolute;
    }

    /* Nuvem grande principal */
    .cloud-1 {
      width: 100px;
      height: 40px;
      top: 40px;
      left: 150px;
      opacity: 0.8;
    }
    .cloud-1::after { width: 50px; height: 50px; top: -25px; left: 15px; }
    .cloud-1::before { width: 40px; height: 40px; top: -15px; left: 50px; }

    /* Nuvem média */
    .cloud-2 {
      width: 60px;
      height: 24px;
      top: 25px;
      left: 60px;
      opacity: 0.5;
    }
    .cloud-2::after { width: 30px; height: 30px; top: -15px; left: 10px; }
    .cloud-2::before { width: 25px; height: 25px; top: -10px; left: 30px; }

    /* Nuvem pequena */
    .cloud-3 {
      width: 40px;
      height: 16px;
      top: 60px;
      left: 280px;
      opacity: 0.4;
    }
    .cloud-3::after { width: 20px; height: 20px; top: -10px; left: 8px; }

    /* ==========================================================
       4. SISTEMA DE ABAS NAVEGÁVEIS (INALTERADO)
       ========================================================== */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #059669, #0284c7);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================
       5. LAYOUTS DE DADOS E CARDS DE INFORMAÇÕES (INALTERADO)
       ========================================================== */
    .temp-display {
      text-align: center;
      margin-bottom: 20px;
    }

    .temp-number {
      font-size: 4.8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 30%, #a7f3d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .condition-text {
      font-size: 1.15rem;
      color: var(--accent-green);
      margin-top: 8px;
      font-weight: 600;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .stat-box:hover {
      transform: translateY(-3px);
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
    }

    .stat-icon {
      font-size: 1.5rem;
    }

    .stat-info span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-info strong {
      font-size: 0.95rem;
      color: #ffffff;
    }

    /* Estilo da Lista de Previsão (Inalterado) */
    .forecast-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .forecast-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 18px;
      border-radius: 166px;
    }

    .forecast-day {
      font-weight: 700;
      width: 75px;
      color: var(--accent-green);
    }

    .forecast-temp {
      font-weight: 800;
      color: var(--accent-blue);
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <div class="card-content">
      
      <header>
        <h1>Guarapuava</h1>
        <p>Paraná • Brasil</p>
      </header>

      <div class="weather-decoration-box">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'hoje')">Atual</button>
        <button class="tab-btn" onclick="switchTab(event, 'detalhes')">Métricas</button>
        <button class="tab-btn" onclick="switchTab(event, 'sol')">Astronomia</button>
        <button class="tab-btn" onclick="switchTab(event, 'previsao')">3 Dias</button>
      </div>

      <div id="hoje" class="tab-content active">
        <div id="conteudo-hoje" class="loading">Carregando dados...</div>
      </div>

      <div id="detalhes" class="tab-content">
        <div id="conteudo-detalhes" class="loading">Carregando detalhes...</div>
      </div>

      <div id="sol" class="tab-content">
        <div id="conteudo-sol" class="loading">Carregando dados astronômicos...</div>
      </div>

      <div id="previsao" class="tab-content">
        <div id="conteudo-previsao" class="loading">Carregando previsão...</div>
      </div>

    </div>
  </div>

  <script>
    /* ==========================================================
       LÓGICA JAVASCRIPT (INALTERADA, exceto remoção da troca de imagem)
       ========================================================== */
    const LATITUDE = -25.3953;
    const LONGITUDE = -51.4581;

    const CODIGOS_CLIMA = {
      0: { texto: 'Céu Limpo ☀️' },
      1: { texto: 'Predominantemente Limpo 🌤️' },
      2: { texto: 'Parcialmente Nublado ⛅' },
      3: { texto: 'Encoberto / Nublado ☁️' },
      45: { texto: 'Névoa / Neblina 🌫️' },
      51: { texto: 'Garoa Leve 🌧️' },
      61: { texto: 'Chuva Moderada 🌧️' },
      65: { texto: 'Chuva Forte 🌧️' },
      80: { texto: 'Pancadas de Chuva 🌦️' },
      95: { texto: 'Trovoadas 🌩️' }
    };

    function obterInfoClima(code) {
      return CODIGOS_CLIMA[code] || { texto: 'Variável 🌤️' };
    }

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      evt.currentTarget.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function formatarHora(isoString) {
      if (!isoString) return '--:--';
      const data = new Date(isoString);
      return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    async function carregarClima() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max&timezone=America%2FSao_Paulo`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        // Obter a condição atual
        const infoAtual = obterInfoClima(data.current.weather_code);

        // --- ABA 1: VISÃO GERAL ---
        const temp = Math.round(data.current.temperature_2m);
        const sensacao = Math.round(data.current.apparent_temperature);
        const umidade = data.current.relative_humidity_2m;
        const vento = Math.round(data.current.wind_speed_10m);

        document.getElementById('conteudo-hoje').innerHTML = `
          <div class="temp-display">
            <div class="temp-number">${temp}°C</div>
            <div class="condition-text">${infoAtual.texto}</div>
          </div>

          <div class="grid-stats">
            <div class="stat-box">
              <span class="stat-icon">🌡️</span>
              <div class="stat-info">
                <span>Sensação</span>
                <strong>${sensacao}°C</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">💧</span>
              <div class="stat-info">
                <span>Umidade</span>
                <strong>${umidade}%</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">💨</span>
              <div class="stat-info">
                <span>Vento</span>
                <strong>${vento} km/h</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">⛰️</span>
              <div class="stat-info">
                <span>Altitude</span>
                <strong>1.120 m</strong>
              </div>
            </div>
          </div>
        `;

        // --- ABA 2: MÉTRICAS AVANÇADAS ---
        const pressao = Math.round(data.current.surface_pressure);
        const precipitacao = data.current.precipitation;
        const probChuva = data.daily.precipitation_probability_max[0] || 0;
        const direcaoVento = data.current.wind_direction_10m;

        document.getElementById('conteudo-detalhes').innerHTML = `
          <div class="grid-stats" style="margin-top:5px;">
            <div class="stat-box">
              <span class="stat-icon">Chuva</span>
              <div class="stat-info">
                <span>Chuva Hoje</span>
                <strong>${precipitacao} mm</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">☔</span>
              <div class="stat-info">
                <span>Prob. Chuva</span>
                <strong>${probChuva}%</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">⏲️</span>
              <div class="stat-info">
                <span>Pressão</span>
                <strong>${pressao} hPa</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">🧭</span>
              <div class="stat-info">
                <span>Direção</span>
                <strong>${direcaoVento}°</strong>
              </div>
            </div>
          </div>
        `;

        // --- ABA 3: ASTRONOMIA & SOL ---
        const uvMax = data.daily.uv_index_max[0];
        const nascerSol = formatarHora(data.daily.sunrise[0]);
        const porSol = formatarHora(data.daily.sunset[0]);
        const maxHoje = Math.round(data.daily.temperature_2m_max[0]);
        const minHoje = Math.round(data.daily.temperature_2m_min[0]);

        document.getElementById('conteudo-sol').innerHTML = `
          <div class="grid-stats" style="margin-top:5px;">
            <div class="stat-box">
              <span class="stat-icon">🌅</span>
              <div class="stat-info">
                <span>Nascer</span>
                <strong>${nascerSol}</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">🌇</span>
              <div class="stat-info">
                <span>Pôr do Sol</span>
                <strong>${porSol}</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">☀️</span>
              <div class="stat-info">
                <span>Índice UV</span>
                <strong>${uvMax}</strong>
              </div>
            </div>
            <div class="stat-box">
              <span class="stat-icon">📊</span>
              <div class="stat-info">
                <span>Máx / Min</span>
                <strong>${maxHoje}° / ${minHoje}°</strong>
              </div>
            </div>
          </div>
        `;

        // --- ABA 4: PREVISÃO 3 DIAS ---
        let htmlPrevisao = '<div class="forecast-list">';
        const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

        for (let i = 1; i <= 3; i++) {
          const dataObj = new Date(data.daily.time[i] + 'T00:00:00');
          const diaNome = diasSemana[dataObj.getDay()];
          const max = Math.round(data.daily.temperature_2m_max[i]);
          const min = Math.round(data.daily.temperature_2m_min[i]);
          const infoDia = obterInfoClima(data.daily.weather_code[i]);

          htmlPrevisao += `
            <div class="forecast-item">
              <span class="forecast-day">${diaNome}</span>
              <span style="font-size:0.8rem; color: var(--text-muted);">${infoDia.texto}</span>
              <span class="forecast-temp">${max}° / ${min}°</span>
            </div>
          `;
        }
        htmlPrevisao += '</div>';
        document.getElementById('conteudo-previsao').innerHTML = htmlPrevisao;

      } catch (err) {
        document.getElementById('conteudo-hoje').innerHTML = `<p style="color:#ef4444; text-align:center;">Erro ao carregar dados.</p>`;
      }
    }

    carregarClima();
  </script>
</body>
</html>
