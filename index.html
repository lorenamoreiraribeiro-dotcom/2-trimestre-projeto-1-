<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Rides 3D | VSCO Aesthetic</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* --- ESTILO VISUAL (CSS) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #faf9f6; /* Tom off-white minimalista */
            color: #2b2b2b;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 40px 0;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #767676;
            margin-bottom: 30px;
        }

        .search-container input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.3s;
        }

        .search-container input:focus {
            border-color: #999999;
        }

        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .car-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .car-card:hover {
            transform: translateY(-2px);
        }

        /* Container do visualizador 3D e Imagem */
        model-viewer {
            width: 100%;
            height: 220px;
            background-color: #fcfbf9;
            border-bottom: 1px solid #eaeaea;
        }

        .car-info {
            padding: 20px;
        }

        .car-model {
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .car-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #999999;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .car-description {
            font-size: 0.9rem;
            color: #555555;
            line-height: 1.5;
        }

        .interaction-bar {
            padding: 15px 20px;
            border-top: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-like {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-like:active {
            transform: scale(1.2);
