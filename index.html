<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima em Guarapuava</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .estado {
      font-size: 0.9rem;
      color: #d1d5db;
      margin-bottom: 20px;
    }

    .temp-container {
      margin: 20px 0;
    }

    .temperatura {
      font-size: 4rem;
      font-weight: bold;
    }

    .condicao {
      font-size: 1.2rem;
      text-transform: capitalize;
      margin-top: 5px;
      color: #e2e8f0;
    }

    .detalhes {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .info-box {
      text-align: center;
    }

    .info-box span {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .info-box strong {
      font-size: 1.1rem;
    }

    .erro {
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Guarapuava</h1>
    <p class="estado">Paraná, Brasil</p>

    <div id="conteudo">
      <p>Carregando dados do clima...</p>
    </div>
  </div>

  <script>
    // Coordenadas geográficas de Guarapuava - PR
    const lat = -25.3953;
    const lon = -51.4581;

    // Mapeamento dos códigos de tempo da Open-Meteo para texto em português
    function obterDescricaoClima(code) {
      const codigos = {
        0: 'Céu limpo',
        1: 'Predominantemente limpo',
        2: 'Parcialmente nublado',
        3: 'Ensolarado / Nublado',
        45: 'Névoa',
        48: 'Sombra de geada',
        51: 'Garoa leve',
        53: 'Garoa moderada',
        55: 'Garoa densa',
        61: 'Chuva leve',
        63: 'Chuva moderada',
        65: 'Chuva forte',
        80: 'Pancadas de chuva leves',
        81: 'Pancadas de chuva moderadas',
        82: 'Pancadas de chuva violentas',
        95: 'Trovoada leve ou moderada'
      };
      return codigos[code] || 'Condição variável';
    }

    async function buscarClima() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=America%2FSao_Paulo`;

      try {
        const resposta = await fetch(url);
        const dados = await resposta.json();

        const temp = Math.round(dados.current.temperature_2m);
        const umidade = dados.current.relative_humidity_2m;
        const vento = Math.round(dados.current.wind_speed_10m);
        const condicao = obterDescricaoClima(dados.current.weather_code);

        document.getElementById('conteudo').innerHTML = `
          <div class="temp-container">
            <div class="temperatura">${temp}°C</div>
            <div class="condicao">${condicao}</div>
          </div>
          
          <div class="detalhes">
            <div class="info-box">
              <span>Umidade</span>
              <strong>${umidade}%</strong>
            </div>
            <div class="info-box">
              <span>Vento</span>
              <strong>${vento} km/h</strong>
            </div>
          </div>
        `;
      } catch (erro) {
        document.getElementById('conteudo').innerHTML = `
          <p class="erro">Não foi possível carregar as informações do clima no momento.</p>
        `;
      }
    }

    // Executa a busca ao carregar a página
    buscarClima();
  </script>

</body>
</html>
