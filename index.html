<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomia Veicular: O Futuro da Mobilidade</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Principal estilo Interface de Software (Mockup do GitHub) */
        .window-container {
            width: 100%;
            max-width: 1100px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Barra de Cabeçalho Superior */
        .window-header {
            background-color: #0d1117;
            padding: 20px 24px;
            border-bottom: 1px solid #30363d;
        }

        .window-header h1 {
            margin: 0;
            font-size: 22px;
            color: #ffffff;
            font-weight: 600;
        }

        .window-header p {
            margin: 6px 0 0 0;
            color: #8b949e;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Seção da Demonstração (Título interno) */
        .demo-title {
            padding: 16px 24px 0 24px;
            font-size: 16px;
            color: #f0f6fc;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* O Cenário Visual Interativo (Simulação da Foto) */
        .simulation-space {
            margin: 16px 24px;
            background: linear-gradient(180deg, #1f242c 0%, #0f1115 100%);
            border: 1px solid #30363d;
            border-radius: 8px;
            height: 380px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
        }

        /* Grid de Perspectiva 3D no Chão */
        .simulation-space::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(48, 54, 61, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(48, 54, 61, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(300px) rotateX(60deg);
            z-index: 1;
        }

        /* Elementos Decorativos do Cenário (Árvores Low-Poly ao fundo) */
        .bg-element {
            position: absolute;
            bottom: 120px;
            left: 80px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 50px solid #2ea043;
            opacity: 0.3;
            z-index: 1;
        }
        .bg-element.two { left: 130px; border-bottom-height: 40px; transform: scale(0.8); }

        /* Vitrine de Carros Alinhados em Perspectiva */
        .car-showcase {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 40px;
            width: 100%;
            padding: 0 20px;
        }

        /* Estilização Avançada dos Carros Isométricos */
        .car-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .car-wrapper:hover {
            transform: translateY(-10px);
        }

        /* Renderização do Modelo do Carro via CSS Shape */
        .car-body {
            width: 180px;
            height: 75px;
            border-radius: 15px 45px 10px 10px;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.6);
            border-bottom: 4px solid rgba(0,0,0,0.4);
        }

        .tesla-theme .car-body { background: linear-gradient(135deg, #ffffff 0%, #cbd5e1
