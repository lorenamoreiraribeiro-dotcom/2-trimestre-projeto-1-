<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Rides | VSCO Aesthetic</title>
    
    <style>
        /* --- ESTILO VISUAL (CSS) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #faf9f6; /* Tom off-white minimalista */
            color: #2b2b2b;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 40px 0;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #767676;
            margin-bottom: 30px;
        }

        .search-container input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.3s;
        }

        .search-container input:focus {
            border-color: #999999;
        }

        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .car-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .car-card:hover {
            transform: translateY(-2px);
        }

        .car-info {
            padding: 20px;
        }

        .car-model {
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .car-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #999999;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .car-description {
            font-size: 0.9rem;
            color: #555555;
            line-height: 1.5;
        }

        .interaction-bar {
            padding: 15px 20px;
            border-top: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-like {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-like:active {
            transform: scale(1.2);
        }

        .like-count {
            font-size: 0.85rem;
            color: #444444;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Family Rides</h1>
        <p class="subtitle">Os melhores carros para a família com o visual que você gosta.</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Pesquisar modelo ou marca..." onkeyup="filtrarCarros()">
        </div>
    </header>

    <main class="grid-container" id="carsContainer">
        </main>

    <script>
        // Banco de dados simulado de carros familiares

                likes: 142
            },
            {
                id: 2,
                modelo: "Toyota RAV4",
                categoria: "SUV Híbrido",
                descricao: "Espaçoso, extremamente confiável e muito econômico para as viagens longas de fim de semana com a família.",
                likes: 98
            },
            {
                id: 3,
                modelo: "Jeep Commander",
                categoria: "SUV 7 Lugares",
                descricao: "Perfeito para famílias grandes. Conta com acabamento premium e espaço modular para bagagens ou passageiros extras.",

            },

                modelo: "Honda Civic Touring",
                categoria: "Sedan Médio",
                descricao: "Para quem prefere a estabilidade de um sedan. Porta-malas excelente, muito conforto traseiro e condução suave.",
                likes: 110
            }
        ];

        // Função para renderizar os carros na tela
        function exibirCarros(lista) {
            const container = document.getElementById('carsContainer');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Nenhum modelo encontrado.</p>';
                return;
            }

            lista.forEach(carro => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <div class="car-info">
                        <h3 class="car-model">${carro.modelo}</h3>
                        <p class="car-category">${carro.categoria}</p>
                        <p class="car-description">${carro.descricao}</p>
                    </div>
                    <div class="interaction-bar">
                        <button class="btn-like" onclick="darLike(${carro.id}, event)">🤍</button>
                        <span class="like-count" id="like-${carro.id}">${carro.likes} curtidas</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Função para o botão de curtida
        function darLike(id, event) {
            const carro = carros.find(c => c.id === id);
            if (carro) {
                carro.likes += 1;
                document.getElementById(`like-${id}`).innerText = `${carro.likes} curtidas`;
                
                // Muda o coração para preenchido ao clicar
                const botao = event.target;
                botao.innerText = "❤️";
            }
        }

        // Função de busca em tempo real (barra de pesquisa)
        function filtrarCarros() {
